suite: pact broker service
templates:
  - service.yaml
release:
  name: pact-broker
  namespace: pact-broker-system
tests:
  - it: renders the ClusterIP service defaults
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: pact-broker
      - equal:
          path: metadata.namespace
          value: pact-broker-system
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0]
          value:
            name: http
            nodePort: null
            port: 80
            protocol: TCP
            targetPort: http
      - equal:
          path: spec.ports[1]
          value:
            name: https
            nodePort: null
            port: 443
            protocol: TCP
            targetPort: https
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/instance: pact-broker
            app.kubernetes.io/name: pact-broker

  - it: configures a fixed cluster IP
    set:
      service.clusterIP: 10.0.0.42
    asserts:
      - equal:
          path: spec.clusterIP
          value: 10.0.0.42

  - it: configures load balancer IP and node ports
    set:
      service.type: LoadBalancer
      service.loadBalancerIP: 203.0.113.10
      service.nodePorts.http: 30080
      service.nodePorts.https: 30443
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
      - equal:
          path: spec.loadBalancerIP
          value: 203.0.113.10
      - equal:
          path: spec.ports[0].nodePort
          value: 30080
      - equal:
          path: spec.ports[1].nodePort
          value: 30443

  - it: omits node ports when they are not explicitly configured
    set:
      service.type: NodePort
    asserts:
      - notExists:
          path: spec.ports[0].nodePort
      - notExists:
          path: spec.ports[1].nodePort
